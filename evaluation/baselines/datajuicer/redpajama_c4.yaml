# OptimalCedar native Data-Juicer baseline.
# Source recipe: datajuicer/data-juicer-hub@47fc34588b5d4258c13747cea37c2b63cf4e11b0
# refined_recipes/pretrain/redpajama-c4-refine.yaml
project_name: optimalcedar-redpajama-c4
dataset_path: /workspace/OptimalCedar/datasets/redpajama_c4/redpajama-c4-raw-829916.jsonl
export_path: /tmp/optimalcedar-datajuicer/redpajama_c4.jsonl
np: 64
text_keys: text

executor_type: default
auto_op_parallelism: false
op_fusion: true
fusion_strategy: probe
use_cache: false
open_tracer: false
skip_op_error: false

process:
  - clean_email_mapper:
  - clean_links_mapper:
  - fix_unicode_mapper:
  - punctuation_normalization_mapper:
  - whitespace_normalization_mapper:
  - alphanumeric_filter:
      tokenization: false
      min_ratio: 0.65
      max_ratio: 0.9
  - average_line_length_filter:
      max_len: 3000
  - character_repetition_filter:
      rep_len: 10
      max_ratio: 0.3
  - language_id_score_filter:
      min_score: 0.6
  - maximum_line_length_filter:
      max_len: 4000
  - perplexity_filter:
      lang: en
      max_ppl: 6000
  - special_characters_filter:
      max_ratio: 0.4
  - words_num_filter:
      lang: en
      tokenization: true
      min_num: 20
      max_num: 10000
  - word_repetition_filter:
      lang: en
      tokenization: true
      rep_len: 10
      max_ratio: 0.231

# The upstream recipe ends with document_simhash_deduplicator. It is omitted
# here because Cedar's compared workload contains only per-sample operators.
