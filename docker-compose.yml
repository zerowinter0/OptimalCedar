services:
  optimalcedar:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
        http_proxy: http://127.0.0.1:7891
        https_proxy: http://127.0.0.1:7891
        no_proxy: localhost,127.0.0.1
    image: optimalcedar:latest
    working_dir: /workspace/OptimalCedar
    command: bash
    tty: true
    stdin_open: true
    shm_size: "8gb"
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: http://127.0.0.1:7891
      HTTPS_PROXY: http://127.0.0.1:7891
      NO_PROXY: localhost,127.0.0.1
      http_proxy: http://127.0.0.1:7891
      https_proxy: http://127.0.0.1:7891
      no_proxy: localhost,127.0.0.1
      PYTHONPATH: /workspace/OptimalCedar
      CH6_OUT_DIR: /workspace/OptimalCedar/outputs/chapter6
    volumes:
      - ./outputs:/workspace/OptimalCedar/outputs
      - ./evaluation/datasets:/workspace/OptimalCedar/evaluation/datasets

  optimalcedar-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:7891
        HTTPS_PROXY: http://127.0.0.1:7891
        NO_PROXY: localhost,127.0.0.1
        http_proxy: http://127.0.0.1:7891
        https_proxy: http://127.0.0.1:7891
        no_proxy: localhost,127.0.0.1
    image: optimalcedar:latest
    working_dir: /workspace/OptimalCedar
    command: bash
    tty: true
    stdin_open: true
    shm_size: "16gb"
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: http://127.0.0.1:7891
      HTTPS_PROXY: http://127.0.0.1:7891
      NO_PROXY: localhost,127.0.0.1
      http_proxy: http://127.0.0.1:7891
      https_proxy: http://127.0.0.1:7891
      no_proxy: localhost,127.0.0.1
      PYTHONPATH: /workspace/OptimalCedar
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CH6_OUT_DIR: /workspace/OptimalCedar/outputs/chapter6
    volumes:
      - .:/workspace/OptimalCedar
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  optimalcedar-torch201:
    container_name: optimalcedar-torch201-dev
    build:
      context: .
      dockerfile: Dockerfile.torch201
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:17890
        HTTPS_PROXY: http://127.0.0.1:17890
        ALL_PROXY: socks5h://127.0.0.1:17890
        NO_PROXY: localhost,127.0.0.1,::1
        http_proxy: http://127.0.0.1:17890
        https_proxy: http://127.0.0.1:17890
        all_proxy: socks5h://127.0.0.1:17890
        no_proxy: localhost,127.0.0.1,::1
    image: optimalcedar:torch2.0.1
    working_dir: /workspace/OptimalCedar
    command: tail -f /dev/null
    tty: true
    stdin_open: true
    shm_size: "64gb"
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      HTTP_PROXY: http://127.0.0.1:17890
      HTTPS_PROXY: http://127.0.0.1:17890
      ALL_PROXY: socks5h://127.0.0.1:17890
      NO_PROXY: localhost,127.0.0.1,::1
      http_proxy: http://127.0.0.1:17890
      https_proxy: http://127.0.0.1:17890
      all_proxy: socks5h://127.0.0.1:17890
      no_proxy: localhost,127.0.0.1,::1
      PYTHONPATH: /workspace/OptimalCedar
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
      CH6_OUT_DIR: /workspace/OptimalCedar/outputs/chapter6
    volumes:
      - .:/workspace/OptimalCedar
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
