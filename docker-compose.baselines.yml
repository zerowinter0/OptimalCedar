services:
  datajuicer:
    container_name: optimalcedar-datajuicer
    build:
      context: ./data-juicer
      dockerfile: Dockerfile
      network: host
    image: optimalcedar-datajuicer:v1.5.3-bb3d88aac1
    working_dir: /data-juicer
    command: tail -f /dev/null
    tty: true
    stdin_open: true
    shm_size: "64gb"
    network_mode: host
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HOME: /root/.cache/huggingface
      DATA_JUICER_CACHE_HOME: /root/.cache/data_juicer
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./data-juicer:/data-juicer
      - ./evaluation/baselines/datajuicer:/optimalcedar-configs:ro
      - .:/workspace/OptimalCedar:ro
      - ./evaluation/baselines/results:/workspace/OptimalCedar/evaluation/baselines/results
      - optimalcedar-datajuicer-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  optimalcedar-datajuicer-cache:
